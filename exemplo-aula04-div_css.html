<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div{
            font-size:  28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal {
            background-color: black;
            border: 2px solid rgb(248, 3, 3);
            color: rgb(241, 240, 238);
        }
        #secundaria {
            background-color: blueviolet;
            border: 2px solid rgb(14, 0, 0);
            color: rgb(247, 247, 248);
        }
        hr{
            border: none;
            border-top: 3px solid pink;
            width: 90%;
        }






    </style>
</head>
<body>
    <div id = "principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id = "secundaria">
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha.                                                               
    </div>
</body>
</html>
